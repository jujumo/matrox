[package]
name = "matrox"
version = "0.1.0"
edition = "2021"
description = "Matrix digital rain in the terminal, driven by CPU/GPU load"
license = "MIT"

[features]
default = ["nvidia"]
# NVIDIA GPU load via NVML (libnvidia-ml is loaded at runtime; absent driver = no GPU source)
nvidia = ["dep:nvml-wrapper"]

[dependencies]
crossterm = "0.29"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
clap = { version = "4.6", features = ["derive"] }
fastrand = "2"
nvml-wrapper = { version = "0.13", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
